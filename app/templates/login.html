{% extends "base.html" %}
{% block title %}登录 - {{ app_name }}{% endblock %}
{% block content %}
<section class="login-wrapper">
  <div class="login-card" data-animate="scale-in">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4"/>
          <path d="M12 18v4"/>
          <path d="m4.93 4.93 2.83 2.83"/>
          <path d="m16.24 16.24 2.83 2.83"/>
          <path d="M2 12h4"/>
          <path d="M18 12h4"/>
          <path d="m4.93 19.07 2.83-2.83"/>
          <path d="m16.24 7.76 2.83-2.83"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <p class="eyebrow">Secure Access</p>
      <h2>{{ app_name }}</h2>
      <p class="muted">OLED 自动化控制台 · 管理员登录</p>
    </div>
    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      {{ error }}
    </div>
    {% endif %}
    <form class="stack" method="post" action="/auth/login">
      <label class="form-field">
        <span>账号</span>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" name="username" placeholder="admin" autocomplete="username" required autofocus />
        </div>
      </label>
      <label class="form-field">
        <span>密码</span>
        <div class="input-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
      </label>
      <button type="submit" class="btn-primary btn-block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        进入控制台
      </button>
    </form>
  </div>
</section>
{% endblock %}

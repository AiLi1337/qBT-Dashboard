{% extends "base.html" %}
{% block title %}派发种子 - {{ instance.name }} - {{ app_name }}{% endblock %}
{% block content %}
<section class="page-header" data-animate="fade-in-up">
  <div>
    <p class="eyebrow">实例详情</p>
    <h2>向 {{ instance.name }} 派发种子</h2>
    <p class="muted page-desc">{{ instance.base_url }}</p>
  </div>
  <div class="header-actions">
    <a href="/instances/{{ instance.id }}" class="link-button">返回实例详情</a>
    <a href="/instances" class="link-button">返回实例列表</a>
  </div>
</section>
<section class="panel panel-form" data-animate="fade-in">
  <div class="panel-head"><h3>添加种子</h3></div>
  <form class="stack add-torrent-form" data-add-torrent data-instance="{{ instance.id }}">
    <label class="form-field"><span>磁力链接 / 种子 URL</span><textarea name="urls" placeholder="magnet:?xt=urn:btih:... 或 http://..." rows="4" required></textarea></label>
    <label class="form-field"><span>保存路径（可选）</span><input name="savepath" placeholder="留空使用默认路径" /></label>
    <div class="form-grid form-grid--two">
      <label class="form-field"><span>下载限速 (MiB/s)</span><input type="number" name="download_limit_speed" value="80.0" step="0.1" min="0" /></label>
      <label class="form-field"><span>上传限速 (MiB/s)</span><input type="number" name="upload_limit_speed" value="80.0" step="0.1" min="0" /></label>
    </div>
    <button type="submit" class="btn-primary btn-block" data-at-submit>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      派发种子
    </button>
    <p class="form-message" data-at-message role="status"></p>
  </form>
</section>
<div id="toast-container" aria-live="polite"></div>
{% endblock %}
